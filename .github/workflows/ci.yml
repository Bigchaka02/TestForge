# Lint, type-check, unit + integration tests, VSIX packaging and the extension-host
# smoke suite (inside a real VS Code) on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run package
      - run: npm run package:check
      - name: Extension-host tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Extension-host tests
        if: runner.os != 'Linux'
        run: npm run test:extension
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: testforge-vsix
          path: testforge.vsix
